# Local infra for development. The Nest app runs on the host (npm run start:dev);
# this compose file provides Postgres (and later Redis/Kafka for microservices).
# Usage:
#   docker compose up -d db          # start Postgres in the background
#   npm run prisma:migrate           # apply migrations
#   npm run prisma:seed              # seed data
services:
  db:
    image: postgres:17-alpine
    container_name: react19_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw
      POSTGRES_DB: react19
    ports:
      - '5433:5432' # host 5433 -> container 5432 (avoids clashing with a local PG on 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d react19']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis — used for cache-aside (CacheModule) and the BullMQ job queue.
  redis:
    image: redis:7-alpine
    container_name: react19_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Observability: Prometheus scrapes the API's /metrics; Grafana graphs it.
  prometheus:
    image: prom/prometheus:latest
    container_name: react19_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:latest
    container_name: react19_grafana
    ports:
      - '3002:3000' # http://localhost:3002 (admin/admin); add Prometheus as a datasource
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus

volumes:
  pgdata:
