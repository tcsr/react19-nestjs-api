name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Throwaway Postgres + Redis for the e2e tests (the app boots CacheModule +
    # BullMQ which need Redis, and Prisma which needs Postgres).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
          POSTGRES_DB: react19_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d react19_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app_pw@localhost:5432/react19_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci # postinstall runs `prisma generate`
      - run: npm run lint
      - run: npm run build
      - run: npm test # unit tests (no DB)

      # Sync schema to the throwaway DB, then run e2e against it.
      - run: npx prisma db push --skip-generate
      - run: npm run test:e2e
